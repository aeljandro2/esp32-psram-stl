name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  IDF_VERSION: v5.5.3
  ARDUINO_ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json

jobs:
  host-tests:
    name: Host tests (${{ matrix.compiler }}, sanitizers)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S tests/host -B build/host -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - run: cmake --build build/host -j
      - run: ./build/host/host_tests

  arduino-lint:
    name: Arduino Library Manager rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/arduino-lint-action@v2
        with:
          library-manager: submit
          compliance: strict

  arduino-build:
    name: Arduino examples build (${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: ESP32
            fqbn: esp32:esp32:esp32:PSRAM=enabled
          - board: ESP32-S3
            fqbn: esp32:esp32:esp32s3:PSRAM=opi
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: |
            - name: esp32:esp32
              source-url: ${{ env.ARDUINO_ESP32_INDEX }}
          sketch-paths: examples
          libraries: |
            - source-path: ./
          enable-warnings-report: true

  arduino-run:
    name: Arduino examples running in QEMU (ESP32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install the ESP32 core
        run: |
          arduino-cli core update-index --additional-urls "$ARDUINO_ESP32_INDEX"
          arduino-cli core install esp32:esp32 --additional-urls "$ARDUINO_ESP32_INDEX"
      - name: Compile (DIO flash mode, which QEMU supports)
        run: |
          for example in examples/*/; do
            name=$(basename "$example")
            arduino-cli compile --fqbn esp32:esp32:esp32:PSRAM=enabled,FlashMode=dio \
              --library "$PWD" --output-dir "build/arduino/$name" "$example"
          done
      - name: Run in QEMU
        run: |
          docker run --rm -v "$PWD":/work -w /work espressif/idf:$IDF_VERSION \
            bash -lc tests/arduino/run-in-qemu.sh

  esp-idf-example:
    name: ESP-IDF example (exceptions off)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32s3
          path: extras/esp-idf/hello_psram

  device-tests:
    name: Device tests in QEMU (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32s3]
    steps:
      - uses: actions/checkout@v4
        with:
          path: esp32-psram-stl  # the directory name is the ESP-IDF component name
      - name: Build and run
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: ${{ matrix.target }}
          path: esp32-psram-stl/tests/device
          command: >-
            idf.py -B build/${{ matrix.target }}
            -D SDKCONFIG=build/${{ matrix.target }}/sdkconfig
            -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.${{ matrix.target }}"
            set-target ${{ matrix.target }} build
            && ./run-qemu.sh ${{ matrix.target }}
      - name: Keep the serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial-${{ matrix.target }}
          path: esp32-psram-stl/tests/device/build/qemu-${{ matrix.target }}.log
          if-no-files-found: ignore
