<path d="M770 275H830" stroke="#2CC5E3" stroke-width="2" class="fl" opacity=".9"/>
<rect x="60" y="316" width="360" height="46" rx="6" fill="#151B24" stroke="#283241" stroke-width="1.5"/>
<text x="76.0" y="345.0" class="mono" font-size="14" fill="#E6EDF3" text-anchor="start">psram::make_unique&lt;Frame&gt;()</text>
<rect x="470" y="316" width="300" height="46" rx="6" fill="#151B24" stroke="#283241" stroke-width="1.5"/>
<text x="486.0" y="345.0" class="regular" font-size="15" fill="#8D98A5" text-anchor="start">the pointer</text>
<rect x="830" y="316" width="310" height="46" rx="6" fill="#151B24" stroke="#2CC5E3" stroke-width="1.5"/>
<text x="846.0" y="345.0" class="regular" font-size="15" fill="#E6EDF3" text-anchor="start">the whole Frame</text>
