<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="Where every byte lives: the container header stays where you declare it; elements, nodes, long strings, and objects made with make_unique go to PSRAM.">
<!-- Fonts: Geist and Geist Mono, SIL Open Font License 1.1 (see licenses/). -->
<title>Where every byte lives: the container header stays where you declare it; elements, nodes, long strings, and objects made with make_unique go to PSRAM.</title>
<style>@font-face{font-family:MNLight;src:url(data:font/woff2;base64,) format('woff2')}.light{font-family:MNLight,system-ui,sans-serif;font-weight:300}@font-face{font-family:MNRegular;src:url(data:font/woff2;base64,) format('woff2')}.regular{font-family:MNRegular,system-ui,sans-serif;font-weight:400}@font-face{font-family:MNMono;src:url(data:font/woff2;base64,) format('woff2')}.mono{font-family:MNMono,ui-monospace,monospace;font-weight:400}@font-face{font-family:MNMonoM;src:url(data:font/woff2;base64,) format('woff2')}.monom{font-family:MNMonoM,ui-monospace,monospace;font-weight:500}.ic{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.fl{stroke-dasharray:3 9;animation:fl 1.4s linear infinite}@keyframes fl{to{stroke-dashoffset:-12}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.sig{visibility:hidden}}</style>
