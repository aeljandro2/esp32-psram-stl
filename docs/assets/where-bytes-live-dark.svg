<text x="60.0" y="100.0" class="mono" font-size="11" fill="#8D98A5" text-anchor="start" letter-spacing="3">YOUR CODE</text>
<text x="470.0" y="100.0" class="mono" font-size="11" fill="#8D98A5" text-anchor="start" letter-spacing="3">WHERE YOU DECLARE IT</text>
<text x="830.0" y="100.0" class="mono" font-size="11" fill="#8D98A5" text-anchor="start" letter-spacing="3">PSRAM</text>
