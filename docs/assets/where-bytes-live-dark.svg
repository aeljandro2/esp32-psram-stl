<path d="M770 339H830" stroke="#283241" stroke-width="2"/>
<path d="M770 339H830" stroke="#2CC5E3" stroke-width="2" class="fl" opacity=".9"/>
<text x="60.0" y="400.0" class="light" font-size="15" fill="#8D98A5" text-anchor="start">Stack, globals, and members of other objects stay where they are; only their heap memory moves.</text>
</svg>
